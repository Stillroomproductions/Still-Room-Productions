<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Outer square (room) -->
  <rect x="40" y="20" width="120" height="120" stroke="currentColor" stroke-width="3" fill="none"/>
  <!-- Inner square (perspective point) -->
  <rect x="75" y="50" width="50" height="50" stroke="currentColor" stroke-width="2" fill="none"/>
  <!-- Perspective lines connecting corners -->
  <line x1="40" y1="20" x2="75" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <line x1="160" y1="20" x2="125" y2="50" stroke="currentColor" stroke-width="1.5"/>
  <line x1="40" y1="140" x2="75" y2="100" stroke="currentColor" stroke-width="1.5"/>
  <line x1="160" y1="140" x2="125" y2="100" stroke="currentColor" stroke-width="1.5"/>
  <!-- Text: STILL ROOM -->
  <text x="100" y="175" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="300" font-size="18" letter-spacing="6" fill="currentColor">STILL ROOM</text>
  <!-- Text: PRODUCTIONS -->
  <text x="100" y="198" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="300" font-size="11" letter-spacing="8" fill="currentColor">PRODUCTIONS</text>
</svg>
